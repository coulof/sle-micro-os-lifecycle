#cloud-config
# Append to the Harvester machine pool "User Data" in Rancher.
# Goal: the node must NOT patch/reboot itself; SUC Plans are the only OS lifecycle owner.
# Registration (SCC regcode) is a placeholder here: substitute it from a secret-backed
# template at deploy time, never commit the real value to Git.
runcmd:
  - systemctl disable --now transactional-update.timer || true
  - systemctl disable --now rebootmgr.service || true
  - systemctl enable health-checker.service || true
  - transactional-update --non-interactive register -r "<REGISTRATION_CODE>" -e "<EMAIL>"
