# Promote a release to the canary wave = change this value and commit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {group: upgrade.cattle.io, kind: Plan}
    patch: |-
      - op: replace
        path: /spec/version
        value: "2026.46-1"
