# podinfo with SUSE branding: Pine background + official SUSE logo (vertical, Green-White, for dark backgrounds)
replicaCount: 3
ui:
  color: "#0c322c"                 # SUSE Pine
  message: "SL Micro lifecycle demo"
  logo: "data:image/svg+xml;base64,"
ingress:
  enabled: false                   # using the host-less Ingress (podinfo-ingress.yaml)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: podinfo
